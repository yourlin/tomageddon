<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />

    <title>番茄酱 Tomageddon｜肉鸽割草，一局就上头</title>
    <!-- 分享卡片：微信读取 description / og / itemprop 与页面首张图片；其他平台读取 og / twitter。
         缩略图用小于 30KB 的方图：浏览器经微信 SDK 分享时缩略图超过约 32KB 会显示为空白 -->
    <meta name="description" content="肉鸽割草爽游！一刀清屏、越打越强，打完这局还想再来一局。" />
    <meta name="keywords" content="番茄酱,Tomageddon,割草,Roguelite,网页游戏,小游戏" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="番茄酱 Tomageddon" />
    <meta property="og:title" content="番茄酱 Tomageddon｜肉鸽割草，一局就上头" />
    <meta property="og:description" content="肉鸽割草爽游！一刀清屏、越打越强，打完这局还想再来一局。" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%icons/share-thumb.jpg" />
    <meta property="og:image" content="%SITE_URL%icons/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%icons/share-card.png" />
    <meta itemprop="name" content="番茄酱 Tomageddon｜肉鸽割草，一局就上头" />
    <meta itemprop="description" content="肉鸽割草爽游！一刀清屏、越打越强，打完这局还想再来一局。" />
    <meta itemprop="image" content="%SITE_URL%icons/share-thumb.jpg" />
    <link rel="canonical" href="%SITE_URL%" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1a0a0c;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #1a0a0c;
      }
      #game {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }
      /* ---------- 启动加载页：脚本下载期间就显示（纯 CSS 动画，主线程忙时也尽量流畅） ---------- */
      #boot-loader {
        --p: 0;
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 40%, #3a1418 0%, #1a0a0c 70%);
        color: #ffe8d6;
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        transition: opacity 0.35s ease;
      }
      #boot-loader.bl-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader.bl-gone {
        display: none;
      }
      #boot-loader.bl-dim {
        background: rgba(26, 10, 12, 0.94);
        backdrop-filter: blur(6px);
      }
      .bl-box {
        width: min(440px, 78vw);
        text-align: center;
      }
      .bl-title {
        font-size: 44px;
        font-weight: bold;
        color: #ff4b3e;
        letter-spacing: 4px;
        text-shadow: 0 4px 0 #5a1012;
        margin-bottom: 64px;
      }
      .bl-title small {
        display: block;
        font-size: 15px;
        letter-spacing: 6px;
        color: #ffd166;
        text-shadow: none;
        margin-top: 4px;
      }
      #boot-loader.bl-dim .bl-title {
        margin-bottom: 56px;
        font-size: 30px;
      }
      .bl-track {
        position: relative;
        height: 18px;
        border-radius: 9px;
        background: #3d1d22;
        box-shadow:
          inset 0 2px 4px rgba(0, 0, 0, 0.5),
          0 0 0 3px #5a1012;
      }
      .bl-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: calc(var(--p) * 100%);
        min-width: 18px;
        border-radius: 9px;
        background: repeating-linear-gradient(-45deg, #e63946 0 10px, #ff6b5e 10px 20px);
        background-size: 28px 28px;
        animation: bl-stripe 0.7s linear infinite;
        transition: width 0.25s ease-out;
        box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.25);
      }
      .bl-runner {
        position: absolute;
        bottom: 12px;
        left: calc(var(--p) * 100%);
        width: 0;
        transition: left 0.25s ease-out;
      }
      .bl-hop {
        position: absolute;
        left: -28px;
        bottom: 0;
        width: 56px;
        height: 56px;
        transform-origin: 50% 100%;
        animation: bl-hop 0.62s cubic-bezier(0.33, 0, 0.67, 1) infinite;
      }
      .bl-hop svg {
        width: 100%;
        height: 100%;
        animation: bl-wobble 1.24s ease-in-out infinite;
      }
      .bl-shadow {
        position: absolute;
        left: -16px;
        bottom: -6px;
        width: 32px;
        height: 7px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.45);
        animation: bl-shadow 0.62s cubic-bezier(0.33, 0, 0.67, 1) infinite;
      }
      .bl-eyes {
        transform-box: fill-box;
        transform-origin: center;
        animation: bl-blink 3.4s infinite;
      }
      .bl-seed {
        position: absolute;
        bottom: 4px;
        width: 6px;
        height: 9px;
        border-radius: 50%;
        background: #ffd23f;
        opacity: 0;
        animation: bl-seed 1.24s ease-out infinite;
      }
      .bl-seed.s2 {
        animation-delay: 0.62s;
      }
      .bl-info {
        display: flex;
        justify-content: space-between;
        margin-top: 14px;
        font-size: 15px;
        color: #ffd6c9;
      }
      .bl-pct {
        font-weight: bold;
        color: #ffd166;
        font-variant-numeric: tabular-nums;
      }
      .bl-tip {
        margin-top: 22px;
        min-height: 20px;
        font-size: 13px;
        color: #b88a85;
        transition: opacity 0.3s;
      }
      @keyframes bl-stripe {
        to {
          background-position: 28px 0;
        }
      }
      @keyframes bl-hop {
        0%,
        100% {
          transform: translateY(0) scale(1.16, 0.84);
        }
        14% {
          transform: translateY(-6px) scale(0.92, 1.1);
        }
        50% {
          transform: translateY(-30px) scale(1, 1);
        }
        86% {
          transform: translateY(-6px) scale(0.94, 1.08);
        }
      }
      @keyframes bl-wobble {
        0%,
        100% {
          transform: rotate(-8deg);
        }
        50% {
          transform: rotate(8deg);
        }
      }
      @keyframes bl-shadow {
        0%,
        100% {
          transform: scale(1.15);
          opacity: 0.55;
        }
        50% {
          transform: scale(0.55);
          opacity: 0.25;
        }
      }
      @keyframes bl-blink {
        0%,
        44%,
        50%,
        100% {
          transform: scaleY(1);
        }
        47% {
          transform: scaleY(0.1);
        }
      }
      @keyframes bl-seed {
        0% {
          opacity: 0;
          transform: translate(-3px, 0);
        }
        10% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(-26px, -16px) rotate(-200deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bl-hop,
        .bl-hop svg,
        .bl-shadow,
        .bl-fill,
        .bl-seed {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- 旧版微信取页面首张大于 300px 的图片作为分享缩略图（移出可视区，不影响页面） -->
    <img src="./icons/share-thumb.jpg" alt="番茄酱 Tomageddon" width="300" height="300" style="position: absolute; left: -9999px; top: 0" />
    <div id="stage"><div id="game"></div></div>
    <div id="boot-loader" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="加载进度 Loading">
      <div class="bl-box">
        <div class="bl-title">番茄酱<small>TOMAGEDDON</small></div>
        <div class="bl-track">
          <div class="bl-fill"></div>
          <div class="bl-runner">
            <span class="bl-seed"></span><span class="bl-seed s2"></span>
            <div class="bl-shadow"></div>
            <div class="bl-hop">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <defs>
                  <radialGradient id="bl-g" cx="38%" cy="35%" r="70%">
                    <stop offset="0" stop-color="#ff8070" />
                    <stop offset="0.6" stop-color="#e63946" />
                    <stop offset="1" stop-color="#a4161a" />
                  </radialGradient>
                </defs>
                <ellipse cx="32" cy="39" rx="25" ry="22" fill="url(#bl-g)" stroke="#5a1012" stroke-width="2.5" />
                <ellipse cx="21" cy="29" rx="6" ry="3.4" fill="#fff" opacity="0.55" transform="rotate(-28 21 29)" />
                <path
                  d="M32 21 L25 13 L31 16 L32 8 L35 16 L41 12 L37 20 L45 21 L37 23 Z"
                  fill="#52b788"
                  stroke="#1b4332"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <g class="bl-eyes">
                  <ellipse cx="25" cy="38" rx="3.2" ry="4.2" fill="#2a1614" />
                  <ellipse cx="39" cy="38" rx="3.2" ry="4.2" fill="#2a1614" />
                  <circle cx="26.2" cy="36.4" r="1.2" fill="#fff" />
                  <circle cx="40.2" cy="36.4" r="1.2" fill="#fff" />
                </g>
                <ellipse cx="18.5" cy="45" rx="4" ry="2.4" fill="#ff8fa3" opacity="0.85" />
                <ellipse cx="45.5" cy="45" rx="4" ry="2.4" fill="#ff8fa3" opacity="0.85" />
                <path d="M28 46 Q32 50.5 36 46" fill="none" stroke="#2a1614" stroke-width="2" stroke-linecap="round" />
              </svg>
            </div>
          </div>
        </div>
        <div class="bl-info"><span class="bl-label">加载中 · Loading</span><span class="bl-pct">0%</span></div>
        <div class="bl-tip"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
