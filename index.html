<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2b0f12" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tomageddon" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>番茄酱 Tomageddon｜肉鸽割草，一局就上头</title>
    <!-- 分享卡片：微信读取 description / og / itemprop 与页面首张图片；其他平台读取 og / twitter。
         缩略图用小于 30KB 的方图：浏览器经微信 SDK 分享时缩略图超过约 32KB 会显示为空白 -->
    <meta name="description" content="肉鸽割草爽游！一刀清屏、越打越强，打完这局还想再来一局。" />
    <meta name="keywords" content="番茄酱,Tomageddon,割草,Roguelite,网页游戏,小游戏" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="番茄酱 Tomageddon" />
    <meta property="og:title" content="番茄酱 Tomageddon｜肉鸽割草，一局就上头" />
    <meta property="og:description" content="肉鸽割草爽游！一刀清屏、越打越强，打完这局还想再来一局。" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%icons/share-thumb.jpg" />
    <meta property="og:image" content="%SITE_URL%icons/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%icons/share-card.png" />
    <meta itemprop="name" content="番茄酱 Tomageddon｜肉鸽割草，一局就上头" />
    <meta itemprop="description" content="肉鸽割草爽游！一刀清屏、越打越强，打完这局还想再来一局。" />
    <meta itemprop="image" content="%SITE_URL%icons/share-thumb.jpg" />
    <link rel="canonical" href="%SITE_URL%" />
    <style>
      @font-face {
        font-family: 'Journal Serif';
        src: url('./assets/ui/fonts/journal-names.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1a0a0c;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #1a0a0c;
      }
      #game {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }
      /* 首屏 HTML 自带加载 UI；无需等待游戏脚本或 Phaser 的资源管线。 */
      #boot-loader {
        --p: 0;
        position: fixed;
        inset: 0;
        z-index: 50;
        overflow: hidden;
        background: #1a0a0c;
        color: #fff0ce;
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        transition: opacity 0.35s ease;
      }
      .bl-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
      }
      #boot-loader.bl-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader.bl-gone {
        display: none;
      }
      .bl-title {
        position: absolute;
        top: 13%;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        text-align: center;
        white-space: nowrap;
      }
      .bl-brand {
        display: block;
        font-size: clamp(44px, 7vw, 96px);
        font-weight: 900;
        letter-spacing: 5px;
        line-height: 1.18;
        color: #fff0ce;
        -webkit-text-stroke: 10px #974b35;
        paint-order: stroke fill;
        text-shadow: 0 7px 0 #48212b;
      }
      .bl-title small {
        display: block;
        width: fit-content;
        margin: 12px auto 0;
        padding: 5px 38px;
        border: 1px solid #c2965b;
        border-radius: 99px;
        background: #3b2226;
        font-size: clamp(12px, 1.4vw, 18px);
        font-weight: 600;
        letter-spacing: 5px;
        color: #eac789;
      }
      .bl-en .bl-brand {
        font-size: clamp(30px, 4.9vw, 70px);
        letter-spacing: 2px;
      }
      .bl-en .bl-title small {
        font-size: clamp(10px, 1vw, 14px);
        letter-spacing: 3px;
      }
      .bl-box {
        position: absolute;
        bottom: 8%;
        left: 53%;
        transform: translateX(-50%);
        width: min(740px, 70vw);
      }
      .bl-info {
        margin: 0 0 13px 10px;
      }
      .bl-stage {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .bl-tomato {
        width: 30px;
        height: 30px;
        object-fit: contain;
      }
      .bl-label {
        font-size: clamp(17px, 2.2vw, 27px);
        font-weight: 600;
        letter-spacing: 1px;
      }
      .bl-progress {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 76px;
        align-items: center;
        gap: 20px;
      }
      .bl-track {
        height: 40px;
        box-sizing: border-box;
        padding: 4px;
        border: 2px solid #dbb475;
        border-radius: 99px;
        background: #30201f;
        box-shadow:
          inset 0 2px 5px #170d11,
          0 3px 0 #30171a;
      }
      .bl-rail {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: inherit;
      }
      .bl-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: calc(var(--p) * 100%);
        border-radius: inherit;
        background: linear-gradient(#ffb16c 0%, #f46a42 28%, #dc4734 65%, #b72e2c 100%);
        box-shadow:
          inset 0 2px 0 #ffdfab,
          inset 0 -2px 0 #852126;
        transition: width 0.25s ease-out;
      }
      #boot-loader.bl-complete .bl-fill {
        transition: none;
      }
      .bl-pct {
        font-size: clamp(23px, 2.7vw, 34px);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .bl-tip-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 26px;
        min-height: 24px;
      }
      .bl-hint-icon {
        width: 23px;
        height: 23px;
        flex: 0 0 auto;
      }
      .bl-tip {
        margin: 0;
        text-align: center;
        font-size: clamp(13px, 1.4vw, 18px);
        line-height: 1.6;
        color: #e5c28d;
        text-wrap: balance;
      }
      /* 同一画面也用于局内资源等待，不会把未完成的对局暴露在背后。 */
      #boot-loader.bl-dim .bl-art {
        filter: brightness(0.8);
      }
      @media (max-height: 500px) and (orientation: landscape) {
        .bl-art {
          object-position: 50% 100%;
        }
        .bl-title {
          top: 10%;
        }
        .bl-brand {
          font-size: clamp(38px, 7vw, 64px);
          -webkit-text-stroke-width: 4px;
        }
        .bl-title small {
          margin-top: 6px;
          padding: 3px 18px;
          font-size: 11px;
        }
        .bl-en .bl-brand {
          font-size: 38px;
        }
        .bl-box {
          bottom: 6%;
          width: 72vw;
          left: 50%;
        }
        .bl-info {
          margin-bottom: 8px;
        }
        .bl-tomato {
          width: 22px;
          height: 22px;
        }
        .bl-label {
          font-size: 17px;
        }
        .bl-progress {
          grid-template-columns: minmax(0, 1fr) 56px;
          gap: 12px;
        }
        .bl-track {
          height: 27px;
          padding: 3px;
        }
        .bl-pct {
          font-size: 24px;
        }
        .bl-tip {
          font-size: 12px;
          min-height: 20px;
        }
      }
      @media (max-height: 500px) {
        .bl-tip-row {
          margin-top: 12px;
        }
        .bl-hint-icon {
          width: 18px;
          height: 18px;
        }
      }
      @media (orientation: portrait) {
        .bl-art {
          object-position: 22% 50%;
        }
        .bl-title {
          top: 13%;
        }
        .bl-box {
          width: 88vw;
          bottom: 9%;
          left: 50%;
        }
        .bl-progress {
          grid-template-columns: minmax(0, 1fr) 58px;
          gap: 12px;
        }
        .bl-track {
          height: 30px;
        }
        .bl-brand {
          font-size: 64px;
        }
        .bl-en .bl-brand {
          font-size: 32px;
        }
        .bl-label {
          font-size: 20px;
        }
        .bl-tip {
          font-size: 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader,
        .bl-fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- 旧版微信取页面首张大于 300px 的图片作为分享缩略图（移出可视区，不影响页面） -->
    <img src="./icons/share-thumb.jpg" alt="番茄酱 Tomageddon" width="300" height="300" style="position: absolute; left: -9999px; top: 0" />
    <div id="stage"><div id="game"></div></div>
    <div id="boot-loader" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="加载进度 Loading">
      <!-- 低优先级：慢网络下先让游戏脚本拿到带宽，背景图晚一点出现不影响进主菜单 -->
      <img class="bl-art" src="./assets/ui/loading-kitchen.webp" alt="" fetchpriority="low" decoding="async" />
      <div class="bl-title"><span class="bl-brand">番茄酱</span><small>TOMAGEDDON</small></div>
      <div class="bl-box">
        <div class="bl-info">
          <div class="bl-stage">
            <img class="bl-tomato" src="./assets/ui/loader-tomato.png" alt="" /><span class="bl-label">加载中 · Loading</span>
          </div>
        </div>
        <div class="bl-progress">
          <div class="bl-track">
            <div class="bl-rail"><div class="bl-fill"></div></div>
          </div>
          <span class="bl-pct">0%</span>
        </div>
        <div class="bl-tip-row">
          <img class="bl-hint-icon" src="./assets/ui/icons/lightbulb.svg" alt="" />
          <div class="bl-tip">小提示：武器会自动攻击，专心走位就好。</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
